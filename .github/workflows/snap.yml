name: Build & publish snap (amd64 + arm64)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-sysid-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ matrix.arch }} to Snap Store
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Download snap (${{ matrix.arch }})
        uses: actions/download-artifact@v4
        with:
          name: api-sysid-${{ matrix.arch }}
          path: dist

      - name: Resolve snap file
        id: snap
        run: |
          file=$(ls dist/*.snap | head -n1)
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Publish to Snap Store (edge)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: edge
